<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remotion — Connecting…</title>
  <style>
    body { font-family: -apple-system, sans-serif; display: flex; align-items: center;
           justify-content: center; height: 100vh; margin: 0; background: #f5f5f5; }
    .card { background: white; border-radius: 16px; padding: 40px 32px; text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,.08); max-width: 360px; }
    h2 { margin: 0 0 8px; font-size: 20px; }
    p  { margin: 0; color: #888; font-size: 15px; }
    .spinner { width: 32px; height: 32px; border: 3px solid #eee;
               border-top-color: #f60; border-radius: 50%;
               animation: spin .8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="card" id="card">
  <div class="spinner"></div>
  <h2>Connecting to Notion…</h2>
  <p>You can close this window if it doesn't redirect automatically.</p>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const code   = params.get('code');
  const error  = params.get('error');

  if (error) {
    document.getElementById('card').innerHTML =
      '<h2>Authorization failed</h2><p>' + error + '</p>';
  } else if (code) {
    // Hand the code to the server — it will redirect to remotion://callback
    window.location.href = '/api/token?code=' + encodeURIComponent(code);
  } else {
    document.getElementById('card').innerHTML =
      '<h2>Nothing to do</h2><p>No code or error received.</p>';
  }
</script>
</body>
</html>
